{% extends 'base.html' %}
{% block content %}


<div class="site-section">
    <div class="container">
        <div class="row mb-5 justify-content-center">
            <div class="col-md-6 text-center">
                <h2 class="display-4 text-black mb-5"><strong>Разработка и Тестирование</strong></h2>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-lg-4">
                <div class="site-block-feature-2 d-flex rounded mb-5">
                    <div class="mr-3">
                        <span class="icon flaticon-agreement font-weight-light "></span>
                    </div>

                    <div class="text">
                        <h3>{{ article.title }}</h3>
                        <img src={{ article.thumbnail.url }} alt={{ article.title }} width="100" height="100" class="rounded-circle profile-photo"/>
                        <strong>{{ article.title }}</strong>
                        <p>{{ article.full_description }}</p>
                        <small>{{ article.time_create }}</small>
                        <hr>
                        <span>{{ article.category.title }}</span>
                    </div>

                </div>
            </div>


            {% endblock %}
